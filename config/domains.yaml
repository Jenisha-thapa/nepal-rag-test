# Service domains and their official sources.
#
# `uv run nepal-rag fetch` downloads every source below into data/raw/<domain>/
# (robots.txt rules and Crawl-delay are respected; donidcr/dolma/dofe/hib ask for 10 s).
# Pages were chosen from each portal's menus: FAQs, citizen charters, service and
# procedure pages, and citizen-facing notices — not procurement / payment notices.
#
# The retriever's knowledge base is the hand-written chunk set in data/chunks/<domain>.yaml,
# written from these pages (see README → "Knowledge base").

