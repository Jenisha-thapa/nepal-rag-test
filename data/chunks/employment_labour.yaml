      - रोजगारदाता तथा योगदानकर्ता सूचीकरण, सामाजिक सुरक्षा नम्बर (SSID) र परिचयपत्र: अनलाइन, ३ दिनभित्र
      - रोजगारदाताको विवरण प्रमाणीकरण, रकम जम्मा, विवरण सच्याउने, KYC verification: तुरुन्तै (सूचीकरण शाखा, दोस्रो तल्ला, कोठा २०७)
      - औषधि उपचार दाबी भुक्तानी: कार्यविधि र दाबी फाराम अनुसार, अनलाइन वा म्यानुअल, ३० दिनभित्र
      - अवकाश दाबी, आश्रित परिवार सुविधा दाबी, वृद्धावस्था निवृत्तिभरण दाबी तथा नवीकरण: सक्कल कागजसहित, ३० दिनभित्र (दोस्रो तल्ला, कोठा २०६)
      - सूचनाको हक अनुसार माग भएको सूचना: २४ घण्टाभित्र (सूचना अधिकारी)
      - गुनासो तथा उजुरी: तुरुन्तै (गुनासो सुन्ने अधिकारी); सोधपुछ: सोधपुछ कक्ष (दोस्रो तल्ला) वा कल सेन्टर १११६
      - योगदानकर्ताको विशेष सापटी, घर कर्जा, शैक्षिक कर्जा: योगदानकर्ता सापटी इकाई (तेस्रो तल्ला)
      SSF service times: registration and SSID within 3 days; medical and retirement claims paid within 30 days; information requests answered within 24 hours.

  - id: ssf-retirement-claim-online
    url: https://ssf.gov.np/pages/withdraw-claim-process
    section: सामाजिक सुरक्षा कोष — अवकाश रकम अनलाइन दाबी प्रक्रिया
    type: procedure
    text: |
      अवकाश रकम दाबी (Withdraw) गर्ने अनलाइन प्रक्रिया:
      १. sosys.ssf.gov.np को Contributor Portal मा Username, Password र SSID राखी लगइन गर्ने (Username र SSID दुवैमा ११ अंकको सामाजिक सुरक्षा कोष नम्बर)।
      २. After Employment मेनुको Withdraw मा क्लिक गर्ने। यो मेनु नदेखिए योगदानकर्ता Terminate भएको छैन; रोजगारदातालाई Employer Portal बाट Terminate गर्न लगाउनुपर्छ।
      ३. KYC मा बैंक विवरण भरेको र कोषबाट Verify भएको हुनुपर्छ; त्यसपछि मात्र निवेदन भर्ने।
      ४. २०७८ असार मसान्तअघि योगदान सुरु गरेकाले निवृत्तिभरण (Pension) रकम अवकाश (Gratuity) मा Transfer गर्न checkbox मा टिक लगाउन सक्छन्; त्यसपछि सुरु गरेकालाई Transfer सुविधा छैन। Pension Type मा All (सबै निकाल्दा खाता बन्द हुन्छ), Percentage Based वा Amount छान्ने।
      ५. रोजगार अन्त्य/सेवा निवृत्त मिति र आवश्यक कागजात अपलोड गरी Submit गर्ने। कोषबाट verification भएपछि KYC मा भरेको बैंक खातामा रकम जम्मा हुन्छ।
      To claim SSF retirement money: log in to the Contributor Portal at sosys.ssf.gov.np, open After Employment, then Withdraw. You must be terminated by your employer and have your KYC bank details verified. Upload documents and submit; the money goes to your bank account.

  - id: ssf-loans
    url: https://ssf.gov.np/list/information-about-loan
    section: सामाजिक सुरक्षा कोष — योगदानकर्ता सापटी
    type: scheme
    text: |
      सामाजिक सुरक्षा कोषले योगदानकर्ता सापटी निर्देशिका, २०७९ बमोजिम योगदानकर्तालाई घर सापटी, शैक्षिक सापटी र विशेष सापटी दिन्छ। विशेष सापटीको निवेदन मोबाइल एपबाट दिन सकिन्छ। सापटी सम्बन्धी सम्पर्क: ०१-५३६०८३७ (योगदानकर्ता सापटी इकाई)।
      SSF contributors can take a housing loan, an education loan or a special loan; the special loan can be applied for through the mobile app.

  - id: ssf-online-services
    url: https://ssf.gov.np
    section: सामाजिक सुरक्षा कोष — अनलाइन सेवा र जानकारी भिडियो
    type: services
    text: |
      कोषका विशेष अनलाइन सुविधा: सबमिशन नम्बर ट्र्याक, कर विवरणका लागि अनुरोध, रोजगार सम्बन्धी विवरण, प्रवासी कामदारको कुल योगदान रकम, पछिल्लो कारोबार, गुनासो/सुझाव, पासवर्ड परिवर्तन अनुरोध फाराम, र आबद्ध अस्पतालबाट मात्र उपचार गर्नुपर्ने स्थानहरू। कोषको मोबाइल एप Android र iOS मा उपलब्ध छ।
      कोषका जानकारी भिडियोहरू: स्वरोजगारमा रहेका व्यक्ति कोषमा कसरी आबद्ध हुने; श्रम स्वीकृति लिइसकेकाले विदेशबाट कोषमा कसरी आबद्ध हुने; योगदानकर्ताको खातामा कति रकम जम्मा भयो कसरी हेर्ने; संस्था दर्ता र श्रमिक (योगदानकर्ता) दर्ता कसरी गर्ने।
