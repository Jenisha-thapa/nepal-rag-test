      विभागका मुख्य कामहरू: वैदेशिक रोजगार व्यवसाय (म्यानपावर) को इजाजतपत्र दिने, नवीकरण, कारबाही र खारेज गर्ने; अभिमुखीकरण तालिम र घरेलु कामदार तालिम दिने संस्थाको अनुमति र नियमन; वैदेशिक रोजगारसम्बन्धी उजुरीको अनुसन्धान र वैदेशिक रोजगार न्यायाधिकरणमा मुद्दा दायर; विभागीय दण्ड सजाय; कामदारलाई राहत तथा क्षतिपूर्ति दिलाउन समन्वय; व्यवसायीको कारोबार रोक्का र रोजगारदाता कम्पनीलाई कालोसूचीमा राख्ने; ठगी नियन्त्रण; गुनासो व्यवस्थापन; विमानस्थलमा कामदारलाई सहजीकरण र सूचना; कामदारको उद्धार र गन्तव्य मुलुकमा पैरवी; गन्तव्य मुलुकसँग श्रम सम्झौता।

