  # ── Social Security Fund (contribution-based) ────────────────────────────────
  - id: ssf-about-schemes
    url: https://ssf.gov.np/pages/introduction
    section: सामाजिक सुरक्षा कोष — परिचय र योजनाहरू
    type: about
    text: |
      सामाजिक सुरक्षा कोष २०६७ चैत्र ७ गते स्थापना भएको हो र हाल योगदानमा आधारित सामाजिक सुरक्षा ऐन, २०७४ बमोजिम सञ्चालित छ। यसले औपचारिक, अनौपचारिक, स्वरोजगार र वैदेशिक रोजगारीमा रहेका श्रमिकलाई योगदानमा आधारित सामाजिक सुरक्षामा आबद्ध गराउँछ।
      ऐनको दफा १० अनुसार सञ्चालन हुने योजनाहरू: औषधि उपचार तथा स्वास्थ्य सुरक्षा, मातृत्व सुरक्षा, दुर्घटना सुरक्षा, अशक्तता सुरक्षा, वृद्ध अवस्था सुरक्षा, आश्रित परिवार सुरक्षा र बेरोजगार सहायता योजना (सामाजिक सुरक्षा योजना सञ्चालन कार्यविधि, २०७५)।
      कोषले रोजगारदाता र श्रमिकको सूचीकरण, योगदान संकलन, दाबी भुक्तानी र आबद्ध स्वास्थ्य संस्थाको सञ्जाल विस्तार गर्छ।
      The Social Security Fund (SSF) runs contribution-based schemes (medical, maternity, accident, disability, old age, dependent family, unemployment) for formal, informal, self-employed and migrant workers.

