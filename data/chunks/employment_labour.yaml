    type: about
    text: |
      वैदेशिक रोजगार ऐन २०६४ अनुसार वैदेशिक रोजगार विभाग २०६५ पुस १६ गते छुट्टै विभागका रूपमा स्थापना भएको हो (पहिले २०२८ मा गठित श्रम विभाग, पछि श्रम तथा रोजगार प्रवर्द्धन विभाग)।
      मन्त्रिपरिषद्को २०७०/८/२६ को निर्णय अनुसार काठमाडौं उपत्यकाभित्र देशभरको श्रम स्वीकृति सम्बन्धी काम गर्न ४ कार्यालय छन्: वैदेशिक रोजगार काठमाडौं कार्यालय, मलेसिया शाखा, कतार शाखा र साउदी अरब शाखा।

