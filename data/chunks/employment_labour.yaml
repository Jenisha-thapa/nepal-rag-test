  # ── Department of Foreign Employment ─────────────────────────────────────────
  - id: dofe-labour-permit-process
    url: https://dofe.gov.np/faq/
    section: नयाँ श्रम स्वीकृति — प्रक्रिया र बीमा रकम
    type: procedure
    text: |
      नयाँ श्रम स्वीकृति (व्यक्तिगत) लिने प्रक्रिया:
      १. https://feims.dofe.gov.np मा लगइन गरी अनलाइन फारम भर्ने।
      २. फारम भर्दा आफूलाई उपयुक्त PDOT (अभिमुखीकरण) कक्षा सञ्चालन गर्ने संस्था छानी कक्षामा सहभागी हुने।
      ३. स्वास्थ्य परीक्षण गर्ने संस्थाले तोकेको दस्तुर अनलाइन तिरी स्वास्थ्य परीक्षण गराउने।
      ४. PDOT र स्वास्थ्य परीक्षणको नतिजा आएपछि (३ कार्यदिन लाग्छ) उमेर अनुसार बीमा रकम अनलाइन तिर्ने: १८–३५ वर्ष रु. ३,७०८; ३६–५० वर्ष रु. ४,९३१; ५१–६४ वर्ष रु. ९,४६३; साथै सामाजिक सुरक्षा कोष रु. २,३०८ र कल्याणकारी कोष रु. १,५००।
      ५. भुक्तानीपछि आवश्यक कागजात स्क्यान गरी रोजेको कार्यालयमा श्रम स्वीकृतिका लागि फारम सबमिट गर्ने।
      Labour permit steps: fill the online form on FEIMS, attend the PDOT orientation class, do the medical test, then pay insurance online (Rs 3,708 for ages 18–35, Rs 4,931 for 36–50, Rs 9,463 for 51–64) plus SSF Rs 2,308 and welfare fund Rs 1,500, and submit.

  - id: dofe-labour-permit-documents
    url: https://dofe.gov.np/faq/
    section: नयाँ श्रम स्वीकृति — आवश्यक कागजात
    type: documents
    text: |
      नयाँ श्रम स्वीकृतिका लागि स्क्यान गरी पेश गर्नुपर्ने कागजात:
      a) ९० दिनभन्दा बढी म्याद बाँकी भएको राहदानी (पासपोर्ट)
      b) म्याद बाँकी रहेको भिसा
      c) रोजगारदाता कम्पनीसँग भएको सम्झौताको प्रति
      d) रोजगारदाताले आधिकारिक इमेलबाट श्रम स्वीकृति गर्ने कार्यालयमा पठाएको इमेल
      e) स्वघोषणा-पत्र
      f) खाडी मुलुकको हकमा सम्बन्धित मुलुकस्थित नेपाली दूतावासले जारी गरेको प्रमाणीकरण (Attestation) पत्र
      g) अंग्रेजी र अरबीबाहेक अन्य भाषामा लेखिएको सम्झौता/COE भए विश्वभाषा क्याम्पस, प्रदर्शनीमार्ग वा अन्य आधिकारिक निकायबाट गरिएको अंग्रेजी अनुवाद
      Documents for an individual labour permit: a passport valid for more than 90 days, a valid visa, the employment contract, the employer's official email, a self-declaration, embassy attestation (Gulf countries) and an English translation of any contract not in English or Arabic.

  - id: dofe-feims-password
    url: https://dofe.gov.np/faq/
    section: FEIMS — पासवर्ड बिर्सेमा
    type: procedure
    text: |
      FEIMS प्रणालीको पासवर्ड बिर्सेमा: "Forgot Password?" लिंकमा क्लिक गरी देखिएको Captcha जस्ताको तस्तै टाइप गरेर NEXT थिच्ने; "Reset using email" वा "Reset using Mobile No" छानी इमेल/मोबाइल नम्बर फेरि टाइप गरेर NEXT थिच्ने। तपाईंको मोबाइल वा इमेलमा पासवर्ड रिसेट लिंक आउँछ।
      IT/FEIMS सम्बन्धी समस्याका लागि सूचना प्रविधि शाखा: 9768998477, it@dofe.gov.np।

