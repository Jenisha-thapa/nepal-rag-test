      वैदेशिक रोजगार विभागका अनलाइन सेवाहरू: अनलाइन श्रम स्वीकृति (FEIMS, https://feims.dofe.gov.np), वैदेशिक रोजगारीको खोजी, श्रम स्वीकृति खोजी (स्टिकर खोजी), पूर्व स्वीकृति, Israel Auxiliary Worker रोजगारीको पोर्टल (FERMS), र उजुरी तथा मुद्दा व्यवस्थापन प्रणाली (ujuri.dofe.gov.np, शुभारम्भ प्रेस नोट ५ साउन, २०८३)।
