  # ── Social security allowance (सामाजिक सुरक्षा भत्ता) ────────────────────────────
  - id: ssa-what-is
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — परिचय
    type: faq
    text: |
      सामाजिक सुरक्षा कार्यक्रम निश्चित उमेरका जेष्ठ नागरिक, एकल महिला, आर्थिक रूपले विपन्न, अशक्त र असहाय, अपाङ्गता भएका, बालबालिका, आफ्नो हेरचाह आफैं गर्न नसक्ने तथा लोपोन्मुख जातिका नागरिकको जीवनयापनमा आइपर्ने जोखिम न्यूनीकरण गर्न नेपाल सरकारले सञ्चालन गरेको गैर-योगदानमूलक (non-contributory) कार्यक्रम हो। भत्ता वितरणको जिम्मेवारी राष्ट्रिय परिचयपत्र तथा पञ्जीकरण विभागको हो।
      The social security allowance is a non-contributory government cash programme for senior citizens, single women, widows, people with disabilities, endangered groups and young children.

  - id: ssa-monthly-rates
    url: https://donidcr.gov.np/pages/social-security-allowance-rate
    section: सामाजिक सुरक्षा भत्ता दर (मासिक रकम)
    type: rates
    text: |
      सामाजिक सुरक्षा (पहिलो संशोधन) ऐन, २०७९ अनुसार भत्ताको मासिक रकम:
      - जेष्ठ नागरिक (७० वर्ष उमेर पुगेका): रु. ४०००
      - अन्य जेष्ठ नागरिक (६० वर्ष पुगेका साविक कर्णालीका जिल्लाका नागरिक र देशभरका दलित नागरिक): रु. २६६०
      - एकल महिला (६० वर्ष पुगेका — अविवाहित, सम्बन्ध विच्छेद वा न्यायिक पृथकीकरण भएका, वा पतिको मृत्यु भएका): रु. २६६०
      - विधवा (पतिको मृत्यु भएका, जुनसुकै उमेर): रु. २६६०
      - पूर्ण अपाङ्गता (क वर्ग, रातो परिचयपत्र, जुनसुकै उमेर): रु. ३९९०
      - अति अशक्त अपाङ्गता (ख वर्ग, नीलो परिचयपत्र, जुनसुकै उमेर): रु. २१२८
      - लोपोन्मुख आदिवासी/जनजाति (कुसुन्डा, बनकरिया, राउटे, सुरेल, हायु, राजी, किसान, लेप्चा, मेचे, कुसवडिया आदि): रु. ३९९०
      - बालबालिका (तोकिएका क्षेत्र/जिल्ला र देशभरका दलित परिवारका ५ वर्षमुनिका, एक आमाबाट बढीमा दुई सन्तान): रु. ५३२
      Monthly allowance amounts: senior citizen 70+ Rs 4000; other senior citizen 60+ Rs 2660; single woman Rs 2660; widow Rs 2660; full disability (red card) Rs 3990; severe disability (blue card) Rs 2128; endangered indigenous groups Rs 3990; child grant Rs 532.

  - id: ssa-how-to-apply
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — निवेदन कहाँ, कहिले र कसरी
    type: procedure
    text: |
      योग्य लाभग्राहीले जुनसुकै समयमा आफ्नो स्थायी बसोबास भएको वडा कार्यालयमा आफैं उपस्थित भई सामाजिक सुरक्षा (पहिलो संशोधन) ऐन, २०७९ को अनुसूची १ बमोजिमको ढाँचामा निवेदन दिनुपर्छ। छानबिन भई प्रणालीमा नाम प्रविष्ट भएको अर्को महिनादेखि भत्ता पाइन्छ।
      स्थायी बसोबास भएको वडा कार्यालयमा मात्र नाम दर्ता गर्न मिल्छ, अन्यत्र मिल्दैन।
      ९० वर्षमाथिका जेष्ठ नागरिक, पूर्ण अपाङ्गता भएका र आफ्नो हेरचाह आफैं गर्न नसक्ने लाभग्राहीको हकमा संरक्षक, माथवर वा स्याहारसुसार गर्ने व्यक्तिले निवेदन दिन सक्छन्।
      Apply any time, in person, at the ward office of your permanent address; payments start the month after you are entered in the system.

  - id: ssa-documents
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — आवश्यक कागजपत्र
    type: documents
    text: |
      सामाजिक सुरक्षा भत्ताका लागि पेश गर्नुपर्ने कागजपत्र:
      - जेष्ठ नागरिक (७० वर्ष, वा दलित र तोकिएका क्षेत्रका ६० वर्ष): नेपाली नागरिकता प्रमाणपत्र र तोकिएको ढाँचामा निवेदन
      - एकल महिला: नागरिकता; न्यायिक पृथकीकरण भएको कागजात वा सम्बन्ध विच्छेदको प्रमाणपत्र; अविवाहित भए स्थानीय तहको सिफारिस
      - विधवा: नागरिकता र पतिको मृत्यु दर्ताको प्रमाणपत्र
      - पूर्ण अपाङ्गता: स्थानीय तहबाट जारी 'क' वर्गको अपाङ्ग परिचयपत्र (रातो कार्ड); १६ वर्ष पुगेको भए नागरिकता, नाबालक भए जन्मदर्ता प्रमाणपत्र
      - अति अशक्त अपाङ्गता: 'ख' वर्गको अपाङ्ग परिचयपत्र (निलो कार्ड); १६ वर्ष पुगेको भए नागरिकता, नाबालक भए जन्मदर्ता
      - लोपोन्मुख जाति: नागरिकता (सामाजिक सुरक्षा ऐन २०७५ अनुसूची १ का जातजाति)
      - बालपोषण भत्ता: जन्म दर्ता प्रमाणपत्र र बाबु वा आमाको (नभए संरक्षकको) नागरिकता
      Documents: citizenship certificate and application form. Widows also need the husband's death registration; disabled persons need the red or blue disability card; the child grant needs the birth registration.

  - id: ssa-age-calculation
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — उमेर गणना
    type: faq
    text: |
      भत्ताका लागि उमेर गणना: बालबालिकाको हकमा जन्म दर्ता प्रमाणपत्र र अन्य लाभग्राहीको हकमा नागरिकता प्रमाणपत्रमा उल्लेखित उमेरलाई आधार मानिन्छ। नागरिकतामा साल र महिना खुलेको तर गते नखुलेको भए सो महिनाको मसान्त, र साल मात्र खुलेको भए नागरिकता जारी मितिलाई आधार मानिन्छ।

  - id: ssa-single-women-40
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — ४० वर्षका एकल महिला
    type: eligibility
    text: |
      ४० वर्ष उमेर पुगेका एकल महिलाले भत्ता पाउँछन्? हाल पाउँदैनन्। सामाजिक सुरक्षा (पहिलो संशोधन) ऐन, २०७९ ले असहाय एकल महिला भत्ताको व्यवस्था गरेको छ (विधवा, तोकिएभन्दा न्यून आय भएका, हेरचाह गर्ने परिवार नभएका वा परिवार विपन्न भएका एकल महिला), तर यसका लागि नेपाल राजपत्रमा सूचना प्रकाशन हुनुपर्छ। उक्त सूचना प्रकाशन नभएकाले हाल ४० वर्षका एकल महिलाले भत्ता पाउने अवस्था छैन।
      Single women aged 40 cannot receive the allowance yet; the required Nepal Gazette notice has not been published.

  - id: ssa-renewal
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — परिचयपत्र नवीकरण
    type: procedure
    text: |
      भत्ता पाउने लाभग्राहीले प्रत्येक आर्थिक वर्षको श्रावण र भाद्र महिनाको मसान्तभित्र सम्बन्धित वडा कार्यालयमा आफैं उपस्थित भई आफ्नो सामाजिक सुरक्षा परिचयपत्र नवीकरण गर्नुपर्छ।
      तोकिएको समयमा नवीकरण गर्न छुटेमा वडा कार्यालयमा गई नयाँ लाभग्राही सरह फेरि नाम दर्ता गराउनुपर्छ; प्रणालीमा प्रविष्ट भएको अर्को महिनादेखि भत्ता पाइन्छ, तर नवीकरण नभएको अवधिको भत्ता पाइँदैन।
      विभागले "सामाजिक सुरक्षा भत्ता परिचयपत्र नवीकरण तथा लाभग्राही सूचीकरण सम्बन्धमा" सूचना ५ साउन, २०८३ मा प्रकाशित गरेको छ।
      Renew your allowance ID card in person at the ward office by the end of Bhadra every fiscal year. If you miss it, register again as a new beneficiary; the missed months are not paid.

  - id: ssa-bank-account
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — बैंक खाता र रकम निकाल्ने
    type: faq
    text: |
      स्थानीय तहले लाभग्राहीको सूची अनलाइन प्रणालीमार्फत बैंकमा पठाएपछि बैंकले शून्य मौज्दातमा खाता खोली भत्ता जम्मा गर्छ। पहिलो पटक भुक्तानी लिन जाँदा लाभग्राही नागरिकता, फोटो लगायतका प्रमाण लिई आफैं उपस्थित भई खाता सक्रिय गराउनुपर्छ।
      रकम तुरुन्त निकाल्नुपर्दैन; अन्य बचत खाता सरह ब्याज पाइन्छ। चेक बुक वा एटिएमबाट बैंकको जुनसुकै शाखाबाट निकाल्न सकिन्छ, र बैंकले चेक, एटिएम, मोबाइल र एसएमएस बैंकिङ सुविधा दिन्छ। एक आर्थिक वर्षमा एक पटक पनि कारोबार नभए स्थानीय तह र बैंकले खातावालाको अवस्था यकिन गर्छन्।
      आफैं जान नसक्नेको हकमा संरक्षकसँग संयुक्त खाता, वा त्यो पनि सम्भव नभए संरक्षकको दस्तखतबाट मात्र खाता सञ्चालन गर्न सकिन्छ।
      The allowance is paid into a zero-balance bank account; visit once in person to activate it. You can withdraw from any branch or ATM, at any time.

  - id: ssa-one-allowance-only
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — दोहोरो भत्ता र निवृत्तिभरण
    type: faq
    text: |
      एकभन्दा बढी समूहमा योग्य भए पनि आफूले रोजेको एउटा समूहबाट मात्र भत्ता पाइन्छ; दोहोरो भत्ता पाउन मिल्दैन।
      दोहोरो भत्ता बुझेमा नाम अभिलेखबाट तत्काल हटाई कानुन बमोजिम कारबाही गरी बुझेको रकम सरकारी बाँकी सरह असुल गरिन्छ र बिगो बमोजिम जरिबाना पनि हुन्छ।
      निवृत्तिभरण पाउने व्यक्तिको मृत्युपछि हकवालाको नाममा निवृत्तिभरण नामसारी हुँदा हकवालाले निवृत्तिभरण वा सामाजिक सुरक्षा भत्तामध्ये एउटा रोज्नुपर्छ; निवृत्तिभरण रोजे भत्ता कट्टा हुन्छ।

  - id: ssa-removal-cases
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — लगत कट्टा हुने अवस्था
    type: faq
    text: |
      लाभग्राही सूचीबाट लगत कट्टा हुने अवस्था:
      - लाभग्राहीको मृत्यु भएमा
      - बालबालिकाको ५ वर्ष उमेर पूरा भएमा
      - बसाइँसराइ गरेमा
      - एकल वा विधवा महिलाले विवाह गरेमा (विवाह दर्ता नभए पनि सर्जमिन मुचुल्का वा स्थानीय तहको पत्रबाट पुष्टि भएमा)
      - दोहोरो दर्ता भएमा
      - सरकारी/सार्वजनिक पदमा बहाल रहेमा वा सरकारी स्वामित्वका संस्थाबाट नियमित पारिश्रमिक, निवृत्तिभरण वा अवकाश सुविधा पाइरहेमा
      - परिचयपत्र नवीकरण नगरेमा
      - स्वेच्छाले भत्ता त्याग गरेमा (वडा कार्यालयमा निवेदन दिनुपर्छ; त्याग गर्नेलाई सम्मानसहित प्रमाणपत्र दिइन्छ)
      लाभग्राहीको मृत्युपछि खातामा बाँकी रकम खाता बन्द गरी नेपाल सरकारको सञ्चित कोषमा फिर्ता जान्छ।

  - id: ssa-migration
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — बसाइँसराइ गरेमा
    type: procedure
    text: |
      भत्ता पाउने व्यक्ति बसाइँसराइ गरी गएमा नयाँ बसोबास गर्ने स्थानीय तहको वडा कार्यालयमा बसाइँसराइ प्रमाणपत्र, भत्ता पाएको विवरण र लगत कट्टाको विवरण बुझाउनुपर्छ। सोही आधारमा सरेर गएको ठाउँबाट नियमित भत्ता पाइन्छ।

  - id: ssa-dalit-endangered
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — दलित र लोपोन्मुख जातिको सूचीकरण
    type: faq
    text: |
      दलित लाभग्राहीको सूचीकरण राष्ट्रिय दलित आयोगको जातीय अनुसूची बमोजिमको जाति र थर अनुसार गरिन्छ। अनुसूचीमा नभएको थर भएका दलितको हकमा जिल्ला प्रशासन कार्यालयको सिफारिसका आधारमा गरिन्छ।
      लोपोन्मुख वा दलित जातिका महिलाले अर्को जातिसँग विवाह गरे पनि नागरिकतामा सम्बन्धित जाति/थर उल्लेख भए भत्ता पाउँछन्।

  - id: ssa-ward-duties-grievance
    url: https://donidcr.gov.np/pages/mostly-asked-questions--social-security-4/
    section: सामाजिक सुरक्षा भत्ता — वडाको जिम्मेवारी, गुनासो र कारबाही
    type: faq
    text: |
      वडा कार्यालयले निवेदन लिने र दर्ता गर्ने, कागजात रुजु गर्ने, प्रणालीमा नाम प्रविष्ट गर्ने, लगत कट्टा गर्ने, गुनासो सम्बोधन गर्ने र भत्ता खातामा गएपछि नाम सार्वजनिक गर्ने काम गर्छ।
      स्थानीय तहले तयार गरेको लाभग्राही सूची Forward Feed हो; त्यसका आधारमा बैंकले खातासहित पठाउने सूची Reverse Feed हो। स्थानीय तह र बैंकबीचको समस्या बैंकिङ समस्या तथा समाधान समितिबाट, नभए विभागबाट सहजीकरण हुन्छ।
      गुनासो वडा कार्यालय, स्थानीय तह, राष्ट्रिय परिचयपत्र तथा पञ्जीकरण विभाग वा अन्य सरकारी निकायमा दर्ता गर्न सकिन्छ। विवरण ढाँटी वा कानुन विपरीत भत्ता लिएमा वा संरक्षकले दुरुपयोग गरेमा स्थानीय तहको न्यायिक समितिले कारबाही गर्छ।

  # ── Health insurance (स्वास्थ्य बीमा) ─────────────────────────────────────────
  - id: hib-what-is
    url: https://hib.gov.np/pages/introduction
    section: स्वास्थ्य बीमा — परिचय
    type: about
    text: |
      स्वास्थ्य बीमा नेपाल सरकारको सामाजिक स्वास्थ्य सुरक्षा अन्तर्गतको योगदानमा आधारित कार्यक्रम हो, जसले स्वास्थ्य सेवा लिँदा हुने आर्थिक जोखिम घटाउँछ। यो २०७२ चैत्र २५ देखि सुरु भएको हो र हाल स्वास्थ्य बीमा बोर्डले सञ्चालन गर्छ।
      स्वास्थ्य बीमा ऐन २०७४ र नियमावली २०७५ अनुसार ज्येष्ठ नागरिकका लागि सरकारले प्रिमियम तिर्ने गरी वार्षिक रु. एक लाखको बीमा, र सबै संगठित क्षेत्रका कर्मचारीले आम्दानीको १% योगदान गरी अनिवार्य आबद्ध हुने व्यवस्था छ।
      Nepal's national health insurance is a contribution-based scheme run by the Health Insurance Board (HIB) since 2072 Chaitra.

  - id: hib-premium-and-coverage
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — शुल्क (योगदान) र सुविधा रकम
    type: fees
    text: |
      स्वास्थ्य बीमाको वार्षिक योगदान: ५ जनासम्मको परिवारलाई रु. ३,५०० (१ देखि ५ जना जति भए पनि रु. ३,५०० नै), र ५ भन्दा बढी भए प्रति थप सदस्य रु. ७००।
      सुविधा (उपचार) रकम: ५ जनासम्मको परिवारलाई रु. १,००,०००; प्रति थप सदस्य रु. २०,००० थपिँदै अधिकतम रु. २,००,०००।
      - ६ जना: योगदान रु. ४,२००, सुविधा रु. १,२०,०००
      - ७ जना: रु. ४,९०० / रु. १,४०,०००
      - ८ जना: रु. ५,६०० / रु. १,६०,०००
      - ९ जना: रु. ६,३०० / रु. १,८०,०००
      - १० जना: रु. ७,००० / रु. २,००,०००
      - ११ जना: रु. ७,७०० / रु. २,००,०००; १२ जना: रु. ८,४०० / रु. २,००,०००
      सुविधा रकम परिवारका सबै सदस्यका लागि एकमुस्ट हो (एकै जनाले पनि प्रयोग गर्न सक्छ)। यो नगद दिइँदैन; उपचार गर्दा रकम घट्दै जान्छ। प्रयोग नभएको रकम अर्को वर्ष सर्दैन, र रकम सकिएमा समय अगावै शुल्क तिरेर नवीकरण गर्न मिल्दैन।
      Health insurance costs Rs 3,500 a year for a family of up to 5 (Rs 700 per extra member) and covers Rs 100,000 of treatment (up to Rs 200,000 for larger families).

  - id: hib-free-enrolment
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — निःशुल्क र छुट पाउने समूह
    type: eligibility
    text: |
      अति गरिब, अति अशक्त अपाङ्गता भएका, कुष्ठरोगी, HIV संक्रमित, जटिल क्षयरोगी (MDR-TB) र ७० वर्ष उमेर पुगेका ज्येष्ठ नागरिकलाई स्वास्थ्य बीमामा निःशुल्क आबद्ध गरिन्छ।
      ७० वर्ष पुगेका ज्येष्ठ नागरिकले आफूले मात्र प्रयोग गर्ने रु. एक लाखसम्मको सुविधासहितको बीमा कार्ड निःशुल्क बनाउन पाउँछन्; त्यो सकिएपछि आवश्यक परे परिवारको बाँकी सुविधा पनि प्रयोग गर्न सकिन्छ।
      महिला स्वास्थ्य स्वयंसेविकाको परिवारलाई दर्ता तथा नवीकरणको योगदानमा ५०% छुट छ।
      Free enrolment: the ultra-poor, people with severe disability, leprosy, HIV or MDR-TB, and senior citizens aged 70+ (their own Rs 100,000 cover). Female community health volunteers get 50% off.

  - id: hib-how-to-enrol-renew
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — दर्ता र नवीकरण कसरी गर्ने
    type: procedure
    text: |
      हरेक वडामा एक जना स्वास्थ्य बीमा दर्ता सहयोगी हुन्छन्, जसले घरघरमा गई फारम भर्ने, फोटो खिच्ने र बीमाबारे बुझाउने काम गर्छन्। सम्पर्क नभए वडा कार्यालयमा गई दर्ता सहयोगी भेट्न सकिन्छ।
      आफ्नै वडाको दर्ता सहयोगीबाट मात्र बीमा गर्न पाइन्छ। घरमूली जहाँ बसोबास गर्छ सोही स्थानको दर्ता सहयोगीमार्फत बीमा गर्नुपर्छ, र बसोबास स्थान नजिकको प्रथम सेवा बिन्दु रोज्न सकिन्छ।
      नवीकरण दर्ता सहयोगीमार्फत वा विद्युतीय माध्यम (Nagarik App, Connect-IPS, e-Sewa, Khalti) बाट गर्न सकिन्छ। निरन्तर सेवाका लागि आबद्ध भएको चक्रमा कम्तीमा एक महिना अगावै नवीकरण गर्नुपर्छ। समयमा नवीकरण नगरे थप शुल्क लाग्ने सूचना बोर्डले ११ भदौ, २०८२ मा जारी गरेको छ।
      Enrol through your ward's health-insurance enrolment assistant. Renew online through Nagarik App, Connect-IPS, eSewa or Khalti at least one month before expiry; late renewal attracts an extra fee.

  - id: hib-enrolment-cycle
    url: https://hib.gov.np/faq/
    section: "स्वास्थ्य बीमा — सदस्यता चक्र (सेवा कहिलेदेखि सुरु हुन्छ)"
    type: faq
    text: |
      जुनसुकै समयमा सदस्य बन्न सकिन्छ, तर सेवा आबद्ध भएको महिनापछिको दोस्रो महिनाको १ गतेदेखि सुरु हुन्छ र अर्को वर्ष सोही आबद्ध महिनामा नवीकरण गर्नुपर्छ:
      - बैशाखमा आबद्ध → असार १ देखि सेवा; जेठमा आबद्ध → साउन १; असारमा → भाद्र १; साउनमा → असोज १
      - भाद्रमा → कार्तिक १; असोजमा → मंसिर १; कार्तिकमा → पुष १; मंसिरमा → माघ १
      - पुषमा → फागुन १; माघमा → चैत्र १; फागुनमा → बैशाख १; चैत्रमा → जेठ १
      बिरामी भएपछि मात्र बीमा गर्ने प्रवृत्ति रोक्न यो प्रतीक्षा अवधि (सदस्यता चक्र) राखिएको हो।
      After enrolling, cover starts on the 1st of the second month after the enrolment month (for example, enrol in Baishakh and cover starts on Asar 1). Renew in the same month each year.

  - id: hib-first-service-point-referral
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — प्रथम सेवा बिन्दु र प्रेषण (रिफर)
    type: faq
    text: |
      प्रथम सेवा बिन्दु भनेको बोर्डसँग सम्झौता गरेको, बीमितको घरबाट सबैभन्दा नजिकको सरकारी स्वास्थ्य संस्था हो। सुरुमा त्यहीँबाट सेवा लिनुपर्छ; आकस्मिक अवस्थामा भने बोर्डमा आबद्ध जुनसुकै संस्थाबाट सेवा लिन सकिन्छ। बोर्डले सूचीकृत गरेका देशभरका जुनसुकै प्रथम सेवा बिन्दुबाट प्रथम सेवा लिन मिल्छ।
      प्रथम सेवा बिन्दुमा आवश्यक सेवा नभए त्यहीँबाट प्रेषण पुर्जी (Refer Card) लिई प्रेषण केन्द्र (Referral Center) मा जानुपर्छ। एक पटक प्रेषण भएपछि सोही रोगको फलोअपका लागि फेरि प्रेषण पुर्जी चाहिँदैन। यो व्यवस्था समय र यातायात खर्च बचाउन र विशेषज्ञ अस्पतालको भीड घटाउन गरिएको हो।
      Use your first service point (the nearest contracted public facility) first; for other hospitals you need a referral card, except in emergencies.

  - id: hib-copayment
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — सहभुक्तानी (Copayment)
    type: fees
    text: |
      सहभुक्तानी (Copayment) भनेको बीमाबाट सेवा लिँदा खर्चको केही प्रतिशत बीमित आफैंले तिर्ने व्यवस्था हो: सरकारी सेवा प्रदायक संस्थामा १०% र अन्य (गैरसरकारी) संस्थामा २०%।
      यो १५ शय्याभन्दा माथिका संस्थामा मात्र लागु हुन्छ। निःशुल्क निदानात्मक तथा उपचारात्मक सेवा, प्रवर्द्धनात्मक सेवा (योग, व्यवहार परिवर्तन), आधारभूत स्वास्थ्य सेवाका औषधी र प्रोसिजर, र आकस्मिक सेवामा सहभुक्तानी लाग्दैन। लक्षित वर्ग र सरकारले तोकेका समूहलाई पनि लाग्दैन (सहभुक्तानी प्रणाली लागु गर्ने कार्यविधि, २०८०)।
      Copayment: 10% at government hospitals and 20% at others, only at facilities with more than 15 beds; none for emergencies or basic services.

  - id: hib-serious-illness-medicines
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — कडा रोगका लागि थप सुविधा र औषधी
    type: faq
    text: |
      क्यान्सर, मुटु रोग, मृगौला रोग, हेड इन्जुरी, स्पाइनल इन्जुरी, सिकलसेल एनिमिया, पार्किन्सोनिजम र अल्जाइमर रोग लागेका बीमितले चिकित्सकको सिफारिस, स्थानीय तहको सिफारिस र निवेदनसहित बोर्डको जिल्ला कार्यालयमार्फत कागजात पेश गरे थप रु. एक लाखसम्मको सुविधा पाउन सक्छन्।
      औषधी: सामान्य बिरामीलाई चिकित्सकले लेखे बमोजिम, र नियमित औषधी खानुपर्ने दीर्घरोगी (Chronic diseases) लाई एकैपटक ३ महिनासम्मको औषधी दिइन्छ।
      Patients with cancer, heart or kidney disease and certain other serious illnesses can get up to Rs 100,000 of extra cover. Chronic patients get up to 3 months of medicine at a time.

  - id: hib-card-lost-digital
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — कार्ड हराएमा, डिजिटल कार्ड र विवरण हेर्ने
    type: procedure
    text: |
      हालको नियम अनुसार बीमा कार्ड लिएर मात्र सेवा पाइन्छ। कार्ड हराएमा नजिकको स्वास्थ्य बीमा बोर्डको जिल्ला सम्पर्क शाखा कार्यालयमा निवेदन दिई रु. ५० दस्तुर बुझाएर प्रतिलिपि बनाउन सकिन्छ।
      नागरिक एप र HIB Profile एपबाट बनेको डिजिटल कार्डबाट पनि सेवा लिन सकिन्छ। यी एप (Play Store / App Store) बाट कार्डको म्याद सकिने मिति, प्रथम सेवा बिन्दु र बाँकी रकम (Current Balance) आफैं हेर्न सकिन्छ।
      A lost health insurance card can be replaced at the HIB district office for Rs 50. A digital card in the Nagarik App or HIB Profile app is also accepted.

  - id: hib-family-changes
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — नवजात शिशु र सदस्यको मृत्यु
    type: faq
    text: |
      नवजात शिशु: बीमित आमाको सदस्यता सक्रिय रहेको अवधिमा जन्मेको शिशुले आमाको सदस्यता बहाल रहँदासम्म थप योगदान नतिरी सेवा पाउँछ; परिवारको बीमा नवीकरण गर्दा शिशुलाई पनि सदस्यका रूपमा थप्न सकिन्छ।
      परिवारको सदस्यको मृत्यु भएमा मृत्यु दर्ता प्रमाणपत्रको प्रतिलिपि पेश गरी निजलाई बीमितबाट हटाउनुपर्छ।

  - id: hib-complaints-contact
    url: https://hib.gov.np/faq/
    section: स्वास्थ्य बीमा — गुनासो, हटलाइन र सम्पर्क
    type: contact
    text: |
      हेलो स्वास्थ्य बीमा निःशुल्क हटलाइन: ११६१ (१५ भदौ, २०८३)।
      सेवा प्रदायक संस्थाले तोकिएको सेवा नदिएमा वा दर्ता सहयोगीले बुझाएको रकम हिनामिना गरेमा बोर्डको टोल फ्री नं. १६६०-०१-११२२४ वा feedback@hib.gov.np मा गुनासो गर्न सकिन्छ। दर्ता सहयोगीले रकम बैंक दाखिला गरी रसिद बुझाउनुपर्छ; हिनामिना प्रमाणित भए कारबाही गरी रकम असुल गरेर बीमितको कार्ड सक्रिय गरिन्छ।
      पदाधिकारी: अध्यक्ष डा. सुवास प्याकुरेल (014100224, chairman@hib.gov.np); कार्यकारी निर्देशक शकुन्तला प्रजापति (ed@hib.gov.np); प्रवक्ता डा. पवन कुमार शाह (claimchief@hib.gov.np); सूचना अधिकारी विकेश मल्ल (9851413029, iec@hib.gov.np); गुनासो सुन्ने अधिकारी सपना पन्त (9851460014, feedback@hib.gov.np)।
      Health insurance hotline: 1161 (free). Complaints: toll-free 1660-01-11224 or feedback@hib.gov.np.

  - id: hib-recent-notices
    url: https://hib.gov.np/content/365/notice-regarding-mandatory-kyc-update-for-old/
    section: स्वास्थ्य बीमा — बीमितका लागि सूचनाहरू
    type: notice
    date_bs: २६ भदौ, २०८३
    text: |
      बीमितका लागि स्वास्थ्य बीमा बोर्डका सूचनाहरू (विस्तृत व्यहोरा सम्बन्धित सूचनाको संलग्न फाइलमा):
      - "स्वास्थ्य बीमामा आवद्ध पुराना बीमितहरुले अनिवार्य KYC Update गर्ने सम्बन्धमा सूचना" — २६ भदौ, २०८३
