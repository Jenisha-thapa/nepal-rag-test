  - id: dolma-land-directive
    url: https://dolma.gov.np/
    section: भूमि प्रशासन निर्देशिका
    type: notice
    date_bs: २९ असोज, २०८३
    text: |
      विभागले "भूमि प्रशासन निर्देशिका" (तेस्रो संशोधन सहित, २०८१) आफ्नो वेबसाइटमा प्रकाशित गरेको छ (हाइलाइट, २९ असोज, २०८३)। मालपोत कार्यालयबाट हुने जग्गा प्रशासन सम्बन्धी कामका लागि यो निर्देशिका हेर्न सकिन्छ। साथै "वेबसाइट स्थानान्तरण तथा सामग्री अद्यावधिक गर्ने सम्बन्धमा" सूचना पनि प्रकाशित छ।
