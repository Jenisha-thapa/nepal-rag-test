# Retrieval benchmark — `uv run nepal-rag eval`
# A question is a hit@k if ANY `expect` string appears in one of the top-k retrieved passages.
# Retrieval only (no LLM): fast and repeatable. Questions are phrased the way citizens ask,
# not copied from the chunks. `expect` lists the fact in the knowledge-base wording AND, where
# it differs, the source page's own wording, so manual and auto chunking are scored fairly.

